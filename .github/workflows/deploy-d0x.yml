name: Simulate d0x deployment

on:
  workflow_dispatch:
    inputs:
      d0x:
        description: Which d0x lane to deploy
        required: true
        type: choice
        options:
          - d01
          - d02
          - d03
          - d04
          - d05

concurrency:
  group: deploy-${{ inputs.d0x }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write
  statuses: write

jobs:
  deploy:
    name: deploy-${{ inputs.d0x }}
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.d0x }}
      TARGET_SHA: ${{ github.sha }}
      TARGET_BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Create deployment
        id: create-deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const ref = process.env.TARGET_SHA
            const environment = process.env.DEPLOY_ENVIRONMENT
            const response = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref,
              environment,
              description: `POC deployment to ${environment}`,
              auto_merge: false,
              required_contexts: [],
              production_environment: false,
              transient_environment: true,
            })

            core.setOutput('deployment_id', String(response.data.id))
            core.info(
              `Created deployment ${response.data.id} for ${ref} from branch ${process.env.TARGET_BRANCH} in ${environment}`
            )
      - name: Simulate deployment work
        run: sleep 3
      - name: Mark deployment successful
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.create-deployment.outputs.deployment_id }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const deploymentId = Number(process.env.DEPLOYMENT_ID)
            const environment = process.env.DEPLOY_ENVIRONMENT
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deploymentId,
              state: 'success',
              log_url: runUrl,
              environment_url: `https://example.invalid/${environment}`,
              auto_inactive: true,
            })
      - name: Inactivate previous deployments in this lane
        uses: actions/github-script@v7
        env:
          CURRENT_DEPLOYMENT_ID: ${{ steps.create-deployment.outputs.deployment_id }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const currentDeploymentId = Number(process.env.CURRENT_DEPLOYMENT_ID)
            const environment = process.env.DEPLOY_ENVIRONMENT
            const runUrl =
              `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                environment,
                per_page: 100,
              }
            )

            deployments.sort((left, right) => {
              return Date.parse(right.created_at) - Date.parse(left.created_at)
            })

            for (const deployment of deployments) {
              if (deployment.id === currentDeploymentId) {
                continue
              }

              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                {
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  per_page: 100,
                }
              )

              statuses.sort((left, right) => {
                return Date.parse(right.created_at) - Date.parse(left.created_at)
              })

              const latestState = statuses[0]?.state

              if (!latestState || ['inactive', 'failure', 'error'].includes(latestState)) {
                continue
              }

              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: 'inactive',
                log_url: runUrl,
                environment_url: `https://example.invalid/${environment}`,
                auto_inactive: false,
              })
            }
      - name: Sync pre-dev deployment gate
        uses: ./.github/actions/sync-predev-status
        with:
          target-sha: ${{ env.TARGET_SHA }}
          affected-environment: ${{ env.DEPLOY_ENVIRONMENT }}
