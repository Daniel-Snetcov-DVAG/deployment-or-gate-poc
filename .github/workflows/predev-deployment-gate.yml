name: Pre-dev deployment gate

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to recompute
        required: true
        type: string
      affected_environment:
        description: Optional environment whose recent SHAs should also be recomputed
        required: false
        type: string

permissions:
  contents: read
  deployments: read
  pull-requests: read
  statuses: write

jobs:
  sync-predev-status:
    name: sync-predev-status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pre-dev deployment gate
        uses: ./.github/actions/sync-predev-status
        with:
          target-sha: >-
            ${{ github.event_name == 'workflow_dispatch'
              && inputs.target_sha
              || github.event.pull_request.head.sha }}
          affected-environment: >-
            ${{ github.event_name == 'workflow_dispatch'
              && inputs.affected_environment
              || '' }}
