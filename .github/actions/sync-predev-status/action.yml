name: Sync pre-dev deployment status
description: Recompute the pre-dev deployment gate for one or more SHAs.

inputs:
  target-sha:
    description: Commit SHA to recompute.
    required: true
  affected-environment:
    description: Optional environment whose recent SHAs should also be recomputed.
    required: false
    default: ""
  allowed-environments:
    description: JSON array of environments that satisfy the pre-dev gate.
    required: false
    default: '["entwicklung","d01","d02","d03","d04","d05"]'
  status-context:
    description: Commit status context name.
    required: false
    default: pre-dev-deployment

runs:
  using: composite
  steps:
    - name: Sync commit status
      uses: actions/github-script@v7
      env:
        AFFECTED_ENVIRONMENT: ${{ inputs.affected-environment }}
        ALLOWED_PREDEV_ENVIRONMENTS: ${{ inputs.allowed-environments }}
        PREDEV_STATUS_CONTEXT: ${{ inputs.status-context }}
        TARGET_SHA: ${{ inputs.target-sha }}
      with:
        script: |
          const owner = context.repo.owner
          const repo = context.repo.repo
          const allowed = JSON.parse(process.env.ALLOWED_PREDEV_ENVIRONMENTS)
          const targetSha = process.env.TARGET_SHA
          const affectedEnvironment = process.env.AFFECTED_ENVIRONMENT
          const targetUrl =
            `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`

          async function latestDeploymentState(environment, sha) {
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                sha,
                environment,
                per_page: 100,
              }
            )

            deployments.sort((left, right) => {
              return Date.parse(right.created_at) - Date.parse(left.created_at)
            })

            for (const deployment of deployments) {
              const statuses = await github.paginate(
                github.rest.repos.listDeploymentStatuses,
                {
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  per_page: 100,
                }
              )

              if (!statuses.length) {
                continue
              }

              statuses.sort((left, right) => {
                return Date.parse(right.created_at) - Date.parse(left.created_at)
              })

              return statuses[0].state
            }

            return null
          }

          async function syncSha(sha) {
            const statesByEnvironment = {}

            for (const environment of allowed) {
              statesByEnvironment[environment] =
                await latestDeploymentState(environment, sha)
            }

            const successfulEnvironments = Object.entries(statesByEnvironment)
              .filter(([, state]) => state === 'success')
              .map(([environment]) => environment)
            const pendingEnvironments = Object.entries(statesByEnvironment)
              .filter(([, state]) => ['pending', 'queued', 'in_progress'].includes(state))
              .map(([environment]) => environment)
            const failedEnvironments = Object.entries(statesByEnvironment)
              .filter(([, state]) => ['failure', 'error'].includes(state))
              .map(([environment]) => environment)
            const inactiveEnvironments = Object.entries(statesByEnvironment)
              .filter(([, state]) => state === 'inactive')
              .map(([environment]) => environment)

            let state = 'pending'
            let description =
              'Deploy this SHA to entwicklung or any d0x environment before merging.'

            if (successfulEnvironments.length) {
              state = 'success'
              description = `Deployment succeeded in ${successfulEnvironments[0]}.`
            } else if (pendingEnvironments.length) {
              description = `Deployment is running in ${pendingEnvironments[0]}.`
            } else if (failedEnvironments.length) {
              state = 'failure'
              description = `Deployment failed in ${failedEnvironments[0]}.`
            } else if (inactiveEnvironments.length) {
              description =
                `Deployment in ${inactiveEnvironments[0]} is inactive. Redeploy this SHA to an allowed environment before merging.`
            }

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha,
              state,
              context: process.env.PREDEV_STATUS_CONTEXT,
              description,
              target_url: targetUrl,
            })

            core.info(
              JSON.stringify(
                {
                  sha,
                  state,
                  description,
                  statesByEnvironment,
                },
                null,
                2
              )
            )
          }

          const shasToSync = new Set([targetSha])

          if (affectedEnvironment && allowed.includes(affectedEnvironment)) {
            const environmentDeployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                environment: affectedEnvironment,
                per_page: 100,
              }
            )

            environmentDeployments
              .sort((left, right) => {
                return Date.parse(right.created_at) - Date.parse(left.created_at)
              })
              .slice(0, 20)
              .forEach((deployment) => {
                if (deployment.sha) {
                  shasToSync.add(deployment.sha)
                }
              })
          }

          for (const sha of shasToSync) {
            await syncSha(sha)
          }
